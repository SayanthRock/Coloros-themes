name: Validate APK

on:
  pull_request:
    branches:
      - main
    paths:
      - 'lsposed-helper/**'
      - '.github/workflows/validate-apk.yml'
  workflow_dispatch:

concurrency:
  group: validate-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        working-directory: lsposed-helper
        run: gradle :app:assembleDebug --no-daemon --stacktrace
