name: Build ColorOS Customizer APK
run-name: Build ColorOS Customizer APK • ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

on:
  push:
    branches: [ main ]
    paths:
      - 'lsposed-helper/**'
      - '.github/workflows/build-helper-apk.yml'
  workflow_dispatch:
    inputs:
      version:
        description: "Manual version name, example: v0.3.1"
        required: false
        default: ""
      publish:
        description: "Publish APK to GitHub Release"
        required: true
        type: boolean
        default: false
  release:
    types: [ published ]

concurrency:
  group: coloros-customizer-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APK_NAME: ColorOS-Customizer

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Resolve APK version
        id: version
        shell: bash
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="v$(grep -E "versionName '" lsposed-helper/app/build.gradle | head -n 1 | sed -E "s/.*versionName '([^']+)'.*/\1/")"
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta)?$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${APK_NAME}-${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: lsposed-helper
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK and build info
        run: |
          mkdir -p dist
          cp lsposed-helper/app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}-${{ steps.version.outputs.version }}.apk"
          cat > dist/BUILD_INFO.txt <<EOF
          Project: ColorOS Customizer APK
          Version: ${{ steps.version.outputs.version }}
          Commit: ${GITHUB_SHA}
          Workflow: ${GITHUB_WORKFLOW}
          Run ID: ${GITHUB_RUN_ID}
          EOF
          sha256sum dist/* > dist/SHA256SUMS-APK.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Write workflow summary
        run: |
          {
            echo "## ColorOS Customizer APK"
            echo ""
            echo "- Version: ${{ steps.version.outputs.version }}"
            echo "- Artifact: ${{ steps.version.outputs.artifact_name }}"
            echo "- APK: dist/${APK_NAME}-${{ steps.version.outputs.version }}.apk"
            echo "- Build info: dist/BUILD_INFO.txt"
            echo "- Checksums: dist/SHA256SUMS-APK.txt"
          } >> "$GITHUB_STEP_SUMMARY"

  release-apk:
    name: Publish APK Release Asset
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-apk.outputs.artifact_name }}
          path: dist

      - name: Create APK release notes
        run: |
          cat > APK_RELEASE_NOTES.md <<EOF
          # ColorOS Customizer APK ${{ needs.build-apk.outputs.version }}

          ## UI update
          - Added new header layout
          - Added cleaner section spacing
          - Added improved cards and buttons
          - Added refined inputs for customization options
          - Kept wallpaper, OTA, and battery tools

          ## Build files
          - APK artifact
          - Build info file
          - SHA256 checksum file
          EOF

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-apk.outputs.version }}
          name: ColorOS Customizer ${{ needs.build-apk.outputs.version }}
          body_path: APK_RELEASE_NOTES.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(needs.build-apk.outputs.version, 'beta') }}
