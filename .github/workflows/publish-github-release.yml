name: Publish GitHub Release
run-name: Publish GitHub Release • ${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref_name }}

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'lsposed-helper/**'
      - 'scripts/**'
      - 'themes/**'
      - 'theme-packs/**'
      - 'system_ext/**'
      - 'customer-options/**'
      - 'module.prop'
      - '.github/workflows/publish-github-release.yml'
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        required: true
        type: choice
        options:
          - apk
          - module
          - both
        default: both
      version:
        description: "Version tag, example: v0.4.0"
        required: false
        default: ""
      publish:
        description: "Publish GitHub Release"
        required: true
        type: boolean
        default: true

concurrency:
  group: publish-github-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APK_NAME: ColorOS-Customizer
  MODULE_ID: ColorOS-Themes-Rock

jobs:
  resolve:
    name: Resolve Build Context
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      run_apk: ${{ steps.meta.outputs.run_apk }}
      run_module: ${{ steps.meta.outputs.run_module }}
      should_publish: ${{ steps.meta.outputs.should_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve version and targets
        id: meta
        shell: bash
        run: |
          EVENT="${{ github.event_name }}"
          REF="${GITHUB_REF}"
          INPUT_TARGET="${{ inputs.target }}"
          INPUT_VERSION="${{ inputs.version }}"
          INPUT_PUBLISH="${{ inputs.publish }}"

          VERSION=""
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [[ -f lsposed-helper/app/build.gradle ]]; then
            VERSION="v$(grep -E "versionName '" lsposed-helper/app/build.gradle | head -n 1 | sed -E "s/.*versionName '([^']+)'.*/\1/")"
          else
            VERSION="$(grep -E '^version=' module.prop | head -n 1 | cut -d'=' -f2-)"
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta)?$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi

          RUN_APK="false"
          RUN_MODULE="false"
          SHOULD_PUBLISH="true"

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            [[ "$INPUT_TARGET" == "apk" || "$INPUT_TARGET" == "both" ]] && RUN_APK="true"
            [[ "$INPUT_TARGET" == "module" || "$INPUT_TARGET" == "both" ]] && RUN_MODULE="true"
            [[ "$INPUT_PUBLISH" == "true" ]] && SHOULD_PUBLISH="true" || SHOULD_PUBLISH="false"
          elif [[ "$REF" == refs/tags/* ]]; then
            RUN_APK="true"
            RUN_MODULE="true"
            SHOULD_PUBLISH="true"
          else
            RUN_APK="true"
            RUN_MODULE="true"
            SHOULD_PUBLISH="true"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "run_apk=$RUN_APK" >> "$GITHUB_OUTPUT"
          echo "run_module=$RUN_MODULE" >> "$GITHUB_OUTPUT"
          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

  validate-module:
    name: Validate Theme Module
    needs: resolve
    if: needs.resolve.outputs.run_module == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Module validation
        run: bash scripts/validate-module.sh

      - name: Theme asset validation
        run: bash scripts/check-theme-size.sh

  build-apk:
    name: Build Android APK
    needs: resolve
    if: needs.resolve.outputs.run_apk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Prepare artifact name
        id: meta
        run: echo "artifact_name=${APK_NAME}-${{ needs.resolve.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug and release APKs
        working-directory: lsposed-helper
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK files
        run: |
          mkdir -p release/apk
          cp lsposed-helper/app/build/outputs/apk/debug/app-debug.apk "release/apk/${APK_NAME}-${{ needs.resolve.outputs.version }}-debug.apk"
          if [[ -f lsposed-helper/app/build/outputs/apk/release/app-release-unsigned.apk ]]; then
            cp lsposed-helper/app/build/outputs/apk/release/app-release-unsigned.apk "release/apk/${APK_NAME}-${{ needs.resolve.outputs.version }}-release-unsigned.apk"
          elif [[ -f lsposed-helper/app/build/outputs/apk/release/app-release.apk ]]; then
            cp lsposed-helper/app/build/outputs/apk/release/app-release.apk "release/apk/${APK_NAME}-${{ needs.resolve.outputs.version }}-release.apk"
          fi
          cat > release/apk/BUILD_INFO.txt <<INFO
          Project: ColorOS Customizer APK
          Version: ${{ needs.resolve.outputs.version }}
          Commit: ${GITHUB_SHA}
          Workflow: ${GITHUB_WORKFLOW}
          Run ID: ${GITHUB_RUN_ID}
          Install note: debug APK is installable for testing. Release APK may need production signing for Play Store.
          INFO
          (cd release/apk && sha256sum * > SHA256SUMS-APK.txt)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: release/apk/*
          if-no-files-found: error
          retention-days: 30

  build-module:
    name: Build Theme Module
    needs:
      - resolve
      - validate-module
    if: needs.resolve.outputs.run_module == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y zip coreutils

      - name: Prepare artifact name
        id: meta
        run: |
          echo "artifact_name=${MODULE_ID}-${{ needs.resolve.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "MODULE_VERSION=${{ needs.resolve.outputs.version }}" >> "$GITHUB_ENV"

      - name: Build module
        run: bash scripts/package.sh

      - name: Collect module files
        run: |
          mkdir -p release/module
          cp dist/* release/module/
          cat > release/module/BUILD_INFO.txt <<INFO
          Project: ${MODULE_ID}
          Version: ${MODULE_VERSION}
          Commit: ${GITHUB_SHA}
          Workflow: ${GITHUB_WORKFLOW}
          Run ID: ${GITHUB_RUN_ID}
          INFO
          cat > release/module/SBOM.txt <<INFO
          Project: ColorOS Themes Rock
          Version: ${MODULE_VERSION}
          Build runner: GitHub Actions ubuntu-latest
          Build tools: bash, zip, coreutils
          Commit: ${GITHUB_SHA}
          INFO
          (cd release/module && sha256sum * > SHA256SUMS.txt)

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: release/module/*
          if-no-files-found: error
          retention-days: 30

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release/module/*'

  publish-release:
    name: Publish GitHub Release
    needs:
      - resolve
      - build-apk
      - build-module
    if: always() && needs.resolve.outputs.should_publish == 'true' && (needs.build-apk.result == 'success' || needs.build-module.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        if: needs.build-apk.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-apk.outputs.artifact_name }}
          path: release/apk

      - name: Download module artifact
        if: needs.build-module.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-module.outputs.artifact_name }}
          path: release/module

      - name: Build release notes
        id: release_meta
        shell: bash
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          echo "release_name=Sayanth Rock ColorOS Release ${VERSION}" >> "$GITHUB_OUTPUT"
          cat > RELEASE_NOTES.md <<INFO
          # Sayanth Rock ColorOS Release ${VERSION}

          ## Highlights
          - APK build and upload automation
          - Theme module ZIP build automation
          - Artifact collection with checksums
          - Public GitHub Release publishing
          - OPPO, OnePlus, and realme customization helper updates

          ## Files
          - ColorOS Customizer APK files when APK build succeeds
          - ColorOS Themes Rock module ZIP when module build succeeds
          - BUILD_INFO files
          - SHA256 checksum files

          ## Install note
          Use the debug APK for direct test installation. Use a properly signed release APK for store distribution.
          INFO

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_meta.outputs.release_name }}
          body_path: RELEASE_NOTES.md
          files: |
            release/apk/*
            release/module/*
          draft: false
          prerelease: ${{ contains(needs.resolve.outputs.version, 'beta') }}
