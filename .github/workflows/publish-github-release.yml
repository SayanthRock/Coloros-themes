name: Publish GitHub Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'lsposed-helper/**'
      - 'scripts/**'
      - 'themes/**'
      - 'theme-packs/**'
      - 'system_ext/**'
      - 'customer-options/**'
      - 'docs/**'
      - 'module.prop'
      - 'latestStable.json'
      - 'latestBeta.json'
      - 'latestNightly.json'
      - '.github/workflows/publish-github-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, example: v0.5.7-beta or v0.5.7'
        required: false
        default: ''
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - beta
          - stable
          - nightly
        default: beta
      publish:
        description: 'Create or update GitHub Release and upload files'
        required: true
        type: boolean
        default: true

concurrency:
  group: publish-github-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  APK_NAME: ColorOS-Customizer
  MODULE_ID: ColorOS-Themes-Rock
  DEFAULT_BETA_VERSION: v0.5.7-beta

jobs:
  build-and-publish:
    name: Build APK, Module, and Release Assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          CHANNEL="${{ inputs.channel || 'beta' }}"
          VERSION="${{ inputs.version }}"
          if [[ -z "$VERSION" && "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          fi
          if [[ -z "$VERSION" && "$CHANNEL" == "beta" && -f latestBeta.json ]]; then
            VERSION="$(python3 - <<'PY'
          import json
          with open('latestBeta.json', 'r', encoding='utf-8') as fh:
              print(json.load(fh).get('version', ''))
          PY
          )"
          fi
          if [[ -z "$VERSION" && "$CHANNEL" == "stable" && -f latestStable.json ]]; then
            VERSION="$(python3 - <<'PY'
          import json
          with open('latestStable.json', 'r', encoding='utf-8') as fh:
              print(json.load(fh).get('version', ''))
          PY
          )"
          fi
          if [[ -z "$VERSION" ]]; then
            VERSION="$DEFAULT_BETA_VERSION"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|nightly))?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "release_name=Sayanth Rock ColorOS ${CHANNEL} ${VERSION}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=Sayanth-Rock-ColorOS-${VERSION}" >> "$GITHUB_OUTPUT"
          echo "MODULE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate theme module
        run: bash scripts/validate-module.sh

      - name: Check theme asset sizes
        run: bash scripts/check-theme-size.sh

      - name: Build Android APK files
        working-directory: lsposed-helper
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Build theme module ZIP
        run: bash scripts/package.sh

      - name: Collect APK and module files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p release/files
          DEBUG_APK="lsposed-helper/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_UNSIGNED_APK="lsposed-helper/app/build/outputs/apk/release/app-release-unsigned.apk"
          RELEASE_APK="lsposed-helper/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$DEBUG_APK" ]]; then
            echo "Debug APK not found: $DEBUG_APK"
            exit 1
          fi
          cp "$DEBUG_APK" "release/files/${APK_NAME}-${VERSION}-debug.apk"
          if [[ -f "$RELEASE_APK" ]]; then
            cp "$RELEASE_APK" "release/files/${APK_NAME}-${VERSION}-release.apk"
          elif [[ -f "$RELEASE_UNSIGNED_APK" ]]; then
            cp "$RELEASE_UNSIGNED_APK" "release/files/${APK_NAME}-${VERSION}-release-unsigned.apk"
          else
            echo "Release APK output was not produced"
            exit 1
          fi
          module_files=(dist/*.zip)
          if [[ ${#module_files[@]} -eq 0 ]]; then
            echo "Module ZIP not found in dist/"
            exit 1
          fi
          cp "${module_files[@]}" release/files/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: release/files/*
          if-no-files-found: error
          retention-days: 30

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release/files/*'

      - name: Create release notes
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          CHANNEL="${{ steps.meta.outputs.channel }}"
          cat > RELEASE_NOTES.md <<INFO
          # Sayanth Rock ColorOS ${CHANNEL} ${VERSION}

          ## Included files
          - Debug APK
          - Release APK output from Gradle
          - ColorOS Themes Rock module ZIP

          ## APK update
          - Working-only dashboard
          - Safe wallpaper tools
          - Rootd customization planning
          - Performance Level guidance
          - Support and rollback guidance
          INFO

      - name: Publish GitHub Release with clobber upload
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/files/*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No files to upload"
            exit 1
          fi
          PRERELEASE_FLAG="--prerelease"
          if [[ "$VERSION" != *"-beta" && "$VERSION" != *"-nightly" ]]; then
            PRERELEASE_FLAG=""
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$RELEASE_NAME" --notes-file RELEASE_NOTES.md $PRERELEASE_FLAG
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$RELEASE_NAME" --notes-file RELEASE_NOTES.md $PRERELEASE_FLAG
          fi
          gh release upload "$VERSION" "${files[@]}" --clobber
